title: Office Application To Script Interpreter Chain
id: 1c5e7a31-9d42-46b8-8f2c-3a7d5b2c2003
status: experimental
description: Detects Office applications spawning script interpreters.
tags:
  - attack.execution
logsource:
  product: windows
  category: process_creation
detection:
  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
  selection_child:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
  condition: selection_parent and selection_child
falsepositives:
  - Office automation and enterprise macros
level: high
