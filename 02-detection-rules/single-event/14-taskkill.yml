title: Taskkill Process Termination Utility
id: 4f2a7c61-8d31-45b9-9e2c-1a5b6d1a1014
status: experimental
description: Detects taskkill process termination utility execution.
references:
  - https://attack.mitre.org/techniques/T1489/
tags:
  - attack.impact
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\taskkill.exe'
  condition: selection
falsepositives:
  - Legitimate process administration
level: medium
