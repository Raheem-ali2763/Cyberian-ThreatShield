title: Windows Command Shell Execution
id: 4a0d3b71-51d1-4d50-9b9d-2d8c9a1a1003
status: experimental
description: Detects Windows command shell execution.
references:
  - https://attack.mitre.org/techniques/T1059/003/
tags:
  - attack.execution
  - attack.t1059.003
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\cmd.exe'
  condition: selection
falsepositives:
  - Administrative scripts
level: low
