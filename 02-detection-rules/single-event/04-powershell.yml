title: PowerShell Process Execution
id: 8a4b2c61-2e4e-45b4-8c1d-5f2a7e1a1004
status: experimental
description: Detects PowerShell process creation.
references:
  - https://attack.mitre.org/techniques/T1059/001/
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  condition: selection
falsepositives:
  - Legitimate PowerShell administration
level: low
