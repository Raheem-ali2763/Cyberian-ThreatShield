title: Windows Script Host Execution
id: 6d4e2a71-3c12-49b8-9a4f-8b1c6a1a1006
status: experimental
description: Detects Windows Script Host process execution.
references:
  - https://attack.mitre.org/techniques/T1059/005/
tags:
  - attack.execution
  - attack.t1059.005
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\wscript.exe'
      - '\cscript.exe'
  condition: selection
falsepositives:
  - Legitimate scripts
level: medium
