title: Regsvr32 Execution
id: 1b3c4d51-6f72-4a31-8e2c-7d1a5b1a1005
status: experimental
description: Detects Regsvr32 process execution.
references:
  - https://attack.mitre.org/techniques/T1218/010/
tags:
  - attack.defense-evasion
  - attack.t1218.010
logsource:
  product: windows
