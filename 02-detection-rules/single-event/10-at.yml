title: Windows AT Command Execution
id: 1a6c8e31-5d42-4b7f-9a2c-3e1d5b1a1010
status: experimental
description: Detects Windows AT command execution.
references:
  - https://attack.mitre.org/techniques/T1053/
tags:
  - attack.persistence
  - attack.t1053
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\at.exe'
  condition: selection
falsepositives:
  - Administrative task scheduling
level: medium
