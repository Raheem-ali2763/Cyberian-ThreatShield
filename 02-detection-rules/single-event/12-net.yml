title: Windows Net Utility Execution
id: 3d8a5c21-7e41-49b6-9c2d-1f5a7b1a1012
status: experimental
description: Detects Windows Net utility execution.
references:
  - https://attack.mitre.org/techniques/T1087/
tags:
  - attack.discovery
  - attack.t1087
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    EventID: 1
    Image|endswith:
      - '\net.exe'
  condition: selection
falsepositives:
  - System administration
level: low
